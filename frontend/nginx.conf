server {
    listen 80;
    server_name _;

    # 关键：Nginx 默认只在启动时解析一次 upstream 域名并缓存 IP。
    # 后端容器重启后 IP 会变，不重新解析就会一直 502。
    # 用 Docker 内置 DNS（127.0.0.11）+ 变量形式的 proxy_pass 强制每次重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # 上传人脸照片可能几 MB，默认 1m 会 413
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 单页应用：前端路由（/students、/checkin…）直接刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可以放心长存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查必须是精确匹配（= 优先级最高），否则会被下面的 SPA fallback 吃掉，
    # 返回 index.html 而不是 JSON
    location = /health {
        proxy_pass $backend/health;
        access_log off;
    }

    # 接口反向代理：保留原始 URI（/api/... 原样转给后端）
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 实时推送签到：必须显式升级协议，否则握手直接失败
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
